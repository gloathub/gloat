<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROGRAM-NAME</title>
  <style>
    body { font-family: monospace; padding: 1em; }
    #output { background: #f4f4f4; padding: 1em 0; }
    .output-row {
      min-height: 1em;
      padding: 0 1em;
      white-space: pre-wrap;
    }
    .output-row.stderr { background: #fff0f0; }
  </style>
</head>
<body>
  <div id="output"></div>
  <script>
WASM-EXEC-JS
  </script>
  <script>
    const outputEl = document.getElementById('output');
    const decoders = {
      1: new TextDecoder(),
      2: new TextDecoder(),
    };
    const currentRows = {1: null, 2: null};

    function currentRow(fd) {
      if (!currentRows[fd]) {
        const row = document.createElement('div');
        row.className = 'output-row ' + (fd === 2 ? 'stderr' : 'stdout');
        outputEl.appendChild(row);
        currentRows[fd] = row;
      }
      return currentRows[fd];
    }

    function writeText(fd, text) {
      const lines = text.split('\n');
      lines.forEach((line, index) => {
        const endsLine = index < lines.length - 1;
        if (line || endsLine || currentRows[fd]) {
          const row = currentRow(fd);
          row.textContent += line;
          if (endsLine) {
            if (row.textContent.endsWith('\r')) {
              row.textContent = row.textContent.slice(0, -1);
            }
            currentRows[fd] = null;
          }
        }
      });
    }

    function writeOutput(fd, buffer) {
      writeText(fd, decoders[fd].decode(buffer, {stream: true}));
      return buffer.length;
    }

    function flushOutput() {
      for (const fd of [1, 2]) {
        writeText(fd, decoders[fd].decode());
      }
    }

    const originalWriteSync = globalThis.fs.writeSync.bind(globalThis.fs);
    globalThis.fs.writeSync = function(fd, buffer) {
      return fd === 1 || fd === 2
        ? writeOutput(fd, buffer)
        : originalWriteSync(fd, buffer);
    };

    function queryArgs() {
      const query = globalThis.location.search.slice(1);
      return query ? query.split(',').map(decodeURIComponent) : [];
    }

    function reportError(error) {
      flushOutput();
      const message = error instanceof Error ? error.message : String(error);
      writeText(2, 'Error: ' + message + '\n');
    }

    let go;
    try {
      go = new Go();
      go.argv = [PROGRAM-NAME-JSON].concat(queryArgs());
    } catch (error) {
      reportError(error);
    }

    if (go) fetch('WASM-FILE')
      .then(r => r.arrayBuffer())
      .then(buf => WebAssembly.instantiate(buf, go.importObject))
      .then(result => go.run(result.instance))
      .then(flushOutput)
      .catch(reportError);
  </script>
</body>
</html>
